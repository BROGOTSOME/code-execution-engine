apiVersion: apps/v1
kind: Deployment
metadata:
  name: problem-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: problem-service
  template:
    metadata:
      labels:
        app: problem-service
    spec:
      containers:
      - name: problem-service
        image: ishnrv3n/code_execution_engine_production-service:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 3000


        env:
        - name: PORT
          value: "3000"

        - name: DB_URL
          value: mongodb://mongodb-service:27017/problem_db
