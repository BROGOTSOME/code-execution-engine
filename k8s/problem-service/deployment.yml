apiVersion: apps/v1
kind: Deployment
metadata:
  name: problem-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: problem-service
  template:
    metadata:
      labels:
        app: problem-service
    spec:
      containers:
      - name: problem-service
        image: problem-service-cee:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000


        env:
        - name: PORT
          value: "3000"

        - name: MONGO_URI
          value: mongodb://mongo:27017/problemdb
