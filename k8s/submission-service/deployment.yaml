apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-service
spec:
  replicas: 2

  selector:
    matchLabels:
      app: submission-service

  template:
    metadata:
      labels:
        app: submission-service

    spec:
      containers:
      - name: submission-service

        image: ishnrv3n/code_execution_engine_submission-service:1.1
        imagePullPolicy: Never

        ports:
        - containerPort: 3001

        env:
        - name: PORT
          value: "3001"

        - name: DB_URL
          value: mongodb://mongodb-service:27017/submission_db

        - name: PROBLEM_SERVICE
          value: http://problem-service:3000/api/v1

        - name: REDIS_HOST
          value: redis-service

        - name: REDIS_PORT
          value: "6379"