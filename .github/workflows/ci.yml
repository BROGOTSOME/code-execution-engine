name: CI - Code Execution Engine 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
env:
  NODE_VERSION: "22"
jobs:
  # this test and file security scan 
  test:
    name: Test - ${{matrix.service}}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # quick notes-> it allows other services to run there job even though a service before failed , btw its is true by default
      matrix:
        service:
          - ProblemService
          - evalution-service
          - submission-service
    defaults:
        run:
          working-directory: ${{ matrix.service }}
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node 
          uses: actions/setup-node@v4
          with:
            node-version: ${{env.NODE_VERSION}}
            cache: npm
            cache-dependency-path: ${{ matrix.service }}/package-lock.json

        - name: Install dependencies
          run: npm ci
   #adding typescript validation 
        - name: TypeScript Type Check
          run: npm run type-check --if-present #
        - name: Run Tests
          run: npm test --if-present # not added yet ,but TODO

        - name: Run Trivy Filesystem Scan
          uses: aquasecurity/trivy-action@master
          with:
            scan-type: fs
            scan-ref: ${{matrix.service}}
            format: table
            exit-code: "1"
            severity: CRITICAL,HIGH
            ignore-unfixed: true
#job 2 is the docker job , todo k8s mafiestion change image to these image  name 
  docker:
    name: Docker -${{matrix.service.name}}
    runs-on: ubuntu-latest
    needs: test #basically like depends on run test first then this 
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: problem-service
            path: ProblemService
            image: cee-problem-service

          - name: submission-service
            path: submission-service
            image: cee-submission-service

          - name: evaluation-service
            path: evalution-service
            image: cee-evaluation-service
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to hub.docker.com
        uses: docker/login-action@v3
        with: 
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{matrix.service.path}}
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}:${{ github.sha }}
      - name: Scan Docker Image - using trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Push Docker Image on hub.docker.com image registry
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}:latest
            


  
