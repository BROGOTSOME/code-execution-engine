services:
  redis:
    image: redis:7-alpine
    container_name: local-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  

  bull-dashboard:
    image: ghcr.io/pontusab/workbench-standalone:latest
    container_name: local-bullmq-dashboard
    ports:
      - "5000:3000"
    depends_on:
      - redis
    environment:
      # This points internally to the 'redis' service above
      - REDIS_URL=redis://local-redis:6379
      # Change this to match the exact name of the queue in your code
      # (Comma-separated for multiple queues: queue1,queue2)
      - QUEUE_NAMES=my-queue 

volumes:
  redis-data:
  